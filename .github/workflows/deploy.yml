name: Deploy Lunatic Items

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies

        run: |
          if [ -d "Items" ]; then cd Items && npm install; else npm install; fi

      - name: Build project
        run: |
          if [ -d "Items" ]; then cd Items && npm run build; else npm run build; fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:

          path: |
            ${{ github.workspace }}/Items/dist
            ${{ github.workspace }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
        # test